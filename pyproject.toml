[project]
name = "brasileirao-data-pipeline"
version = "0.1.0"
description = "Pipeline de dados RAW -> REFINED -> MARTS sobre o Campeonato Brasileiro com DuckDB"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
