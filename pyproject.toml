[project]
name = "brasileirao-data-pipeline"
version = "0.1.0"
description = "Pipeline de dados RAW -> REFINED -> MARTS sobre o Campeonato Brasileiro com DuckDB"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integracao: executa o pipeline sobre os CSVs reais de data/raw (ignorado se ausentes)",
]

[tool.coverage.run]
source = ["pipeline"]

[tool.coverage.report]
show_missing = true
fail_under = 80
